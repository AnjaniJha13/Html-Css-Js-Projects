<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cricket Game</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin-top: 50px;
    }
    button {
      font-size: 20px;
      margin: 10px;
      padding: 10px 20px;
      border: 2px solid #000;
    }
    .heading img {
      width: 50px;
      height: 50px;
    }
    .icon img {
      height: 20px;
      width: 20px;
    }
  </style>
</head>
<body>
  <div>
    <h1 class="heading">Welcome to Bat Ball Stump Game <img src="cricket.png" alt=""></h1>

    <button class="icon" onclick="playGame('Bat')">Bat <img src="cricket-bat.png" alt=""></button>
    <button class="icon" onclick="playGame('Ball')">Ball <img src="ball.png" alt=""></button>
    <button class="icon" onclick="playGame('Stump')">Stump <img src="stump.png" alt=""></button>
  </div>

  <script>
    function playGame(userChoice) {
      const randomNumber = Math.random() * 3;
      let computerChoice;

      if (randomNumber <= 1) {
        computerChoice = 'Bat';
      } else if (randomNumber <= 2) {
        computerChoice = 'Ball';
      } else {
        computerChoice = 'Stump';
      }

      let resultMsg;
      if (userChoice === computerChoice) {
        resultMsg = 'It is a Tie!';
      } else if (
        (userChoice === 'Bat' && computerChoice === 'Ball') ||
        (userChoice === 'Ball' && computerChoice === 'Stump') ||
        (userChoice === 'Stump' && computerChoice === 'Bat')
      ) {
        resultMsg = 'You Win!';
      } else {
        resultMsg = 'Computer Wins!';
      }

      alert(`You chose ${userChoice}. Computer chose ${computerChoice}. ${resultMsg}`);
    }
  </script>
</body>
</html>
